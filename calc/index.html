<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="calc">
        <div class="calc-body">
            <div class="display">
                <p class="nums" data-nums>0</p>
                <div class="action" data-action></div>
            </div>
            <div class="calc-buts" data-buts>
                <button type="button" class="but" data-but="c">C</button>
                <button type="button" class="but" data-but="/">/</button>
                <button type="button" class="but" data-but="*">*</button>
                <button type="button" class="but" data-but="-">-</button>
                <button type="button" class="but" data-but="7">7</button>
                <button type="button" class="but" data-but="8">8</button>
                <button type="button" class="but" data-but="9">9</button>
                <button type="button" class="but plus" data-but="+">+</button>
                <button type="button" class="but" data-but="4">4</button>
                <button type="button" class="but" data-but="5">5</button>
                <button type="button" class="but" data-but="6">6</button>
                <button type="button" class="but" data-but="1">1</button>
                <button type="button" class="but" data-but="2">2</button>
                <button type="button" class="but" data-but="3">3</button>
                <button type="button" class="but ent" data-but="Enter">Ent</button>
                <button type="button" class="but zero" data-but="0">0</button>
                <button type="button" class="but" data-but=".">.</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
