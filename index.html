<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="catalog">
            <div class="price-card">
            <h3 class="card-plan">Базовый</h3>
            <div class="card-price">0 ₽<span>/мес</span></div>
            <ul class="card-features">
                <li>До 3 проектов</li>
                <li>1 Гб места на диске</li>
                <li>Базовая поддержка</li>
            </ul>
            <button class="btn-price btn-secondary">Начать</button>
        </div>

        <!-- Карточка 2 (Акцентная) -->
        <div class="price-card card-featured">
            <div class="card-badge">Популярно</div>
            <h3 class="card-plan">Стандарт</h3>
            <div class="card-price">1 490 ₽<span>/мес</span></div>
            <ul class="card-features">
                <li>До 20 проектов</li>
                <li>15 Гб места на диске</li>
                <li>Приоритетная поддержка</li>
            </ul>
            <button class="btn-price btn-primary">Выбрать</button>
        </div>

        <!-- Карточка 3 -->
        <div class="price-card">
            <h3 class="card-plan">Максимум</h3>
            <div class="card-price">4 990 ₽<span>/мес</span></div>
            <ul class="card-features">
                <li>Безлимитные проекты</li>
                <li>100 Гб места на диске</li>
                <li>Персональный менеджер</li>
            </ul>
            <button class="btn-price btn-secondary">Купить</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
